[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intent-engine"
version = "0.8.0"
description = "Prosody-aware AI system that preserves and interprets emotional intent in voice conversations."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kase Branham" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "prosody-protocol[audio]>=0.1.0a3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
whisper = ["openai-whisper>=20230918", "prosody-protocol[audio]>=0.1.0a3"]
deepgram = ["deepgram-sdk>=5,<8"]
assemblyai = ["assemblyai>=0.20"]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.56"]
local-llm = ["llama-cpp-python>=0.2"]
elevenlabs = ["elevenlabs>=1.8.1"]
coqui = ["coqui-tts>=0.27"]
espeak = ["pyttsx3>=2.99"]
examples = [
    "fastapi>=0.95",
    "uvicorn>=0.23",
    "python-multipart>=0.0.9",
    "httpx>=0.25",
    "prosody-protocol[api]>=0.1.0a3",
    "twilio>=8",
    "slack_sdk>=3.27",
    "discord.py>=2.3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.5",
    "types-PyYAML>=6.0",
    "pre-commit>=3.0",
]
all = [
    "intent-engine[whisper,deepgram,assemblyai,claude,openai,local-llm,elevenlabs,coqui,espeak,examples,dev]",
]

[project.urls]
Repository = "https://github.com/kase1111-hash/Intent-Engine"
Issues = "https://github.com/kase1111-hash/Intent-Engine/issues"

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "--strict-markers -v"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

# Provider SDKs are optional extras and are imported lazily, so they are
# usually absent when type checking. Treat them as untyped either way.
[[tool.mypy.overrides]]
module = [
    "anthropic",
    "assemblyai",
    "deepgram",
    "elevenlabs",
    "llama_cpp",
    "openai",
    "pyttsx3",
    "TTS",
    "TTS.*",
    "whisper",
]
ignore_missing_imports = true

# numpy comes in through prosody-protocol[audio]. Newer releases ship stubs in
# syntax newer than `python_version` above (the `type` statement), which mypy
# rejects. This package never imports numpy directly, so skip it.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
